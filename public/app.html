<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elite Brothers Club</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/slack.css">
</head>
<body class="app-page">
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="workspace">
        <div class="brand-logo brand-logo--sm">
          <img src="assets/logo.jpg" alt="Elite Brothers Club logo" onerror="this.style.display='none'">
        </div>
        <span class="workspace-name">Elite Brothers Club</span>
      </div>

      <nav class="side-nav" id="side-nav">
        <div class="side-section">Elections</div>
        <a class="side-item" href="?view=polls" data-view="polls">
          <span class="side-hash">#</span>
          <span class="side-item-label">All polls</span>
        </a>
        <div id="poll-links"></div>

        <div class="side-section hidden" id="admin-section">Organizer</div>
        <a class="side-item hidden" href="?view=create" data-view="create" id="nav-create">
          <span class="side-hash">+</span>
          <span class="side-item-label">New poll</span>
        </a>
        <a class="side-item hidden" href="?view=invites" data-view="invites" id="nav-invites">
          <span class="side-hash">#</span>
          <span class="side-item-label">Invite codes</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-meta">
          <div class="user-name" id="user-name">…</div>
          <div class="user-role" id="user-role"></div>
        </div>
        <button class="side-icon-btn" id="signout-btn" title="Sign out" aria-label="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="topbar-hash" id="topbar-hash"></span>
        <h1 class="topbar-title" id="topbar-title">All polls</h1>
        <span id="topbar-pill"></span>
        <span class="topbar-spacer"></span>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>

      <main class="content">
        <div class="content-inner" id="view"></div>
      </main>
    </div>
  </div>

  <div id="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
